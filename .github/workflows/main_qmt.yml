name: QMT validation and manual acceptance image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_acceptance_image:
        description: Publish the tested image for explicitly authorized acceptance only
        type: boolean
        default: false
      approved_commit:
        description: Exact reviewed 40-character source commit; required for publication
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Verify migrations and booking/request transactions against disposable SQL
        run: npm run test:sql
      - run: npm run lint
      - run: npm run build
      - run: node scripts/cost-check.cjs
      - name: Report unselected B1 costs without granting release approval
        run: node scripts/cost-check.cjs --app-service
      - name: Compile infrastructure without deployment
        run: |
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/qmt-main.json"
          az bicep build --file infra/database.bicep --outfile "$RUNNER_TEMP/qmt-database.json"
          az bicep build --file infra/environment.bicep --outfile "$RUNNER_TEMP/qmt-environment.json"
          az bicep build --file infra/budget-guard.bicep --outfile "$RUNNER_TEMP/qmt-budget-guard.json"
          az bicep build --file infra/production-budget.bicep --outfile "$RUNNER_TEMP/qmt-production-budget.json"
          az bicep build --file infra/app-service.bicep --outfile "$RUNNER_TEMP/qmt-app-service.json"
          az bicep build --file infra/app-service-acceptance.bicep --outfile "$RUNNER_TEMP/qmt-app-service-acceptance.json"
      - name: Build non-root deployment image without publishing
        run: docker build --tag qmt:validation .
      - name: Smoke-test the image without SQL or external providers
        run: bash scripts/smoke-image.sh

  publish-acceptance-image:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_acceptance_image && github.ref == 'refs/heads/copilot/qmt-cost-controlled-relaunch-20261021'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Require the exact reviewed source commit
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
        run: |
          [[ "$APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$APPROVED_COMMIT" = "$GITHUB_SHA"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the acceptance image without credentials or operational data
        run: |
          docker build --tag qmt:validation \
            --label org.opencontainers.image.source=https://github.com/errandom/QMT \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" .
      - name: Verify the exact image before publishing
        run: bash scripts/smoke-image.sh
      - name: Publish the immutable-source tag and record the registry digest
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/errandom/qmt:acceptance-$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag qmt:validation "$image"
          docker push "$image"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
          [[ "$digest" =~ ^ghcr\.io/errandom/qmt@sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Source commit: `%s`\n\nPublished image: `%s`\n\nAnonymous pull must pass before Azure provisioning.\n' "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Require anonymous digest pull before this image is usable by Azure
        env:
          IMAGE_DIGEST: ${{ steps.publication.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/qmt-anonymous-docker"
          docker --config "$RUNNER_TEMP/qmt-anonymous-docker" pull "$IMAGE_DIGEST"
      - name: Remove the job registry login
        if: always()
        run: docker logout ghcr.io
